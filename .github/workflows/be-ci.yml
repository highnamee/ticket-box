name: Backend CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/be/**'
      - '.github/workflows/be-ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'apps/be/**'
      - '.github/workflows/be-ci.yml'

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/be
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/be/go.mod'
          check-latest: true
          cache-dependency-path: apps/be/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./... --timeout=5m

  test:
    name: Test & Build Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ticketbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/be
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgrespassword
      TEST_DB_NAME: ticketbox_test
      TEST_DB_SSLMODE: disable

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/be/go.mod'
          check-latest: true
          cache-dependency-path: apps/be/go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Vet Analysis
        run: go vet ./...

      - name: Run Tests (Unit & PostgreSQL Integration)
        run: go test -v -race -coverprofile=coverage.out ./internal/...

      - name: Build Binary
        run: go build -v -o bin/api ./cmd/api/main.go
