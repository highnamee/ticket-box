basePath: /api/v1
definitions:
  response.APIResponse:
    properties:
      data: {}
      error: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  response.PaginatedData:
    properties:
      items: {}
      pagination:
        $ref: '#/definitions/response.PaginationMeta'
    type: object
  response.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    name: Ticket Box Team
  description: RESTful API documentation for the Ticket Box event booking platform.
  title: Ticket Box Backend API
  version: "1.0"
paths:
  /ping:
    get:
      description: Returns system health status and server timestamp
      produces:
      - application/json
      responses:
        "200":
          description: API is healthy
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Health check
      tags:
      - System
  /tickets:
    get:
      description: Retrieve all public tickets (ACTIVE and SOLD_OUT, excluding private
        INACTIVE tickets) with pagination
      parameters:
      - default: 1
        description: Page number (default 1, min 1)
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page (default 10, min 1, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Tickets retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.PaginatedData'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get public tickets
      tags:
      - Tickets
produces:
- application/json
schemes:
- http
- https
swagger: "2.0"
