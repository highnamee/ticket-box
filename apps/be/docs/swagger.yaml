basePath: /api/v1
definitions:
  domain.Ticket:
    properties:
      available_stock:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: number
      status:
        $ref: '#/definitions/domain.TicketStatus'
      total_quantity:
        type: integer
      updated_at:
        type: string
    type: object
  domain.TicketStatus:
    enum:
    - ACTIVE
    - SOLD_OUT
    - INACTIVE
    type: string
    x-enum-varnames:
    - TicketStatusActive
    - TicketStatusSoldOut
    - TicketStatusInactive
  response.APIResponse:
    properties:
      data: {}
      error: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    name: Ticket Box Team
  description: RESTful API documentation for the Ticket Box event booking platform.
  title: Ticket Box Backend API
  version: "1.0"
paths:
  /ping:
    get:
      description: Returns system health status and server timestamp
      produces:
      - application/json
      responses:
        "200":
          description: API is healthy
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Health check
      tags:
      - System
  /tickets:
    get:
      description: Retrieve all public tickets (ACTIVE and SOLD_OUT, excluding private
        INACTIVE tickets)
      produces:
      - application/json
      responses:
        "200":
          description: Tickets retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.Ticket'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get public tickets
      tags:
      - Tickets
produces:
- application/json
schemes:
- http
- https
swagger: "2.0"
