basePath: /api/v1
definitions:
  domain.UserRole:
    enum:
    - USER
    - ADMIN
    type: string
    x-enum-varnames:
    - RoleUser
    - RoleAdmin
  domain.UserStatus:
    enum:
    - ACTIVE
    - INACTIVE
    - BANNED
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusInactive
    - StatusBanned
  http.AuthResponse:
    properties:
      tokens:
        $ref: '#/definitions/http.AuthTokenResponse'
      user:
        $ref: '#/definitions/http.UserResponse'
    type: object
  http.AuthTokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 900
        type: integer
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  http.ForgotPasswordRequest:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  http.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: SecurePassword123!
        type: string
    required:
    - email
    - password
    type: object
  http.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - refresh_token
    type: object
  http.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      full_name:
        example: Nguyen Van A
        maxLength: 100
        type: string
      password:
        example: SecurePassword123!
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  http.ResetPasswordRequest:
    properties:
      new_password:
        example: NewSecurePassword123!
        maxLength: 72
        minLength: 8
        type: string
      token:
        example: 3a7f8e9b...
        type: string
    required:
    - new_password
    - token
    type: object
  http.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: user@example.com
        type: string
      full_name:
        example: Nguyen Van A
        type: string
      id:
        example: 01956550-9d3e-7a4c-81b4-2e91cf98f01b
        type: string
      role:
        allOf:
        - $ref: '#/definitions/domain.UserRole'
        example: USER
      status:
        allOf:
        - $ref: '#/definitions/domain.UserStatus'
        example: ACTIVE
    type: object
  response.APIResponse:
    properties:
      data: {}
      error: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  response.PaginatedData:
    properties:
      items: {}
      pagination:
        $ref: '#/definitions/response.PaginationMeta'
    type: object
  response.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    name: Ticket Box Team
  description: RESTful API documentation for the Ticket Box event booking platform.
  title: Ticket Box Backend API
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiates password reset process. If email exists, creates single-use
        reset token (15m validity). Always returns 200 to prevent user enumeration.
      parameters:
      - description: Email address for password reset
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Instructions sent if account exists
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Invalid email format
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Request password reset
      tags:
      - Authentication
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verify email and password credentials, returning user profile and
        access/refresh tokens.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/http.AuthResponse'
              type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Account inactive or banned
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Authenticate user and generate JWT tokens
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Issue a new pair of JWT access/refresh tokens using a valid unexpired
        refresh token.
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/http.AuthTokenResponse'
              type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Refresh expired access token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email, password, and full name.
        Returns user profile and JWT auth tokens.
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/http.AuthResponse'
              type: object
        "400":
          description: Invalid request payload or validation error
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Register a new user account
      tags:
      - Authentication
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Validates single-use reset token and updates the user's password.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successful
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Invalid or expired reset token, or weak password
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Reset password with token
      tags:
      - Authentication
  /ping:
    get:
      description: Returns system health status and server timestamp
      produces:
      - application/json
      responses:
        "200":
          description: API is healthy
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Health check
      tags:
      - System
  /tickets:
    get:
      description: Retrieve all public tickets (ACTIVE and SOLD_OUT, excluding private
        INACTIVE tickets) with pagination
      parameters:
      - default: 1
        description: Page number (default 1, min 1)
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page (default 10, min 1, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Tickets retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.PaginatedData'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get public tickets
      tags:
      - Tickets
  /users/me:
    get:
      description: Fetch profile information for the currently authenticated user
        based on JWT Bearer token.
      produces:
      - application/json
      responses:
        "200":
          description: User profile retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/http.UserResponse'
              type: object
        "401":
          description: Unauthorized or missing token
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get current authenticated user profile
      tags:
      - Users
produces:
- application/json
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Type 'Bearer ' followed by your JWT access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
